name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch Cloudflare Pages env vars (build + runtime bootstrap)
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          HTTP_CODE=$(curl -s -o /tmp/project.json -w "%{http_code}" \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects/kivora")
          echo "CF API HTTP status: $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ]; then
            # Print only the error chain (codes/messages — no secret values)
            node -e '
              try {
                const p = JSON.parse(require("fs").readFileSync("/tmp/project.json", "utf8"));
                console.log("CF errors:", JSON.stringify(p.errors || p).slice(0, 400));
              } catch { console.log("(non-JSON response)"); }
            '
            echo "::warning::Could not fetch CF project env — continuing; runtime bootstrap supplies env in production"
          else
            node -e '
              const fs = require("fs");
              const p = JSON.parse(fs.readFileSync("/tmp/project.json", "utf8"));
              const r = p.result || {};
              const vars = r.deployment_configs?.production?.env_vars
                || r.production_env_vars
                || r.env_vars
                || {};
              const lines = [];
              for (const [k, v] of Object.entries(vars)) {
                const val = typeof v === "string" ? v : (v && v.value !== undefined ? v.value : null);
                if (val == null || val === "") continue; // secret_text values are redacted by the API
                lines.push(k + "=" + val);
              }
              console.log("CF env vars found (names only): " + Object.keys(vars).join(", "));
              console.log("Exported (values not logged): " + lines.map(l => l.split("=")[0]).join(", "));
              fs.writeFileSync(process.env.GITHUB_ENV, lines.join("\n") + "\n", { flag: "a" });
            '
          fi
          rm -f /tmp/project.json

      - name: Build (next-on-pages)
        run: npx @cloudflare/next-on-pages@1

      - name: Generate hash-based CSP for prerendered pages
        run: node scripts/generate-csp.mjs

      # v5.24 — deploy steps ran unconditionally; without the two Cloudflare
      # secrets the run goes red on every push. Guard them so the workflow
      # degrades to a build-check while the Cloudflare Pages git integration
      # remains the active deployer. When both secrets exist, this workflow
      # OWNS the deploy and verifies it below.
      - name: Deploy guard (secrets present?)
        id: guard
        env:
          CF_TOKEN_SET: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          CF_ACCOUNT_SET: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          if [ "$CF_TOKEN_SET" = "true" ] && [ "$CF_ACCOUNT_SET" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets are not set — skipping wrangler deploy. The Cloudflare Pages git integration remains the active deployer. Add both secrets (repo Settings → Secrets and variables → Actions) to let this workflow own deploys."
          fi

      - name: Deploy to Cloudflare Pages
        if: steps.guard.outputs.enabled == 'true'
        run: npx wrangler@3 pages deploy .vercel/output/static --project-name=kivora --branch=main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # v5.24 — post-deploy probe: production must answer /api/health with
      # 200 after the wrangler deploy is accepted. Retries absorb propagation.
      - name: Post-deploy probe (/api/health)
        if: steps.guard.outputs.enabled == 'true'
        run: |
          ok=0
          for i in 1 2 3 4 5; do
            sleep 15
            code=$(curl -s -o /tmp/health.json -w "%{http_code}" https://kivora.pages.dev/api/health || true)
            echo "probe $i: HTTP $code"
            if [ "$code" = "200" ]; then ok=1; break; fi
          done
          if [ "$ok" != "1" ]; then
            echo "::error::production /api/health did not return 200 after deploy"
            exit 1
          fi
          cat /tmp/health.json
