name: Weekly Deep Maintenance

# Weekly engine (v5.24) — the deeper sweep the daily probes can't do:
#   1. dependency-audit — npm audit (prod deps) + "updates we're missing"
#      report (npm outdated + next.js major watch) written to the job
#      summary. Fails on high/critical prod advisories that aren't on the
#      accepted-mitigations list. Pair with dependabot.yml (weekly PRs).
#   2. codeql — security & quality scan of the JS codebase (public repos
#      only; skipped cleanly otherwise).
#   3. weekly-telemetry — healthcheck in weekly mode: crash signatures,
#      stale push subscriptions (>60d), 30-day error trend. Findings open
#      a single auto-maintained issue.
#
# Secrets (all optional):
#   SUPABASE_URL, SUPABASE_SERVICE_KEY — enables telemetry

on:
  schedule:
    - cron: '23 5 * * 1' # Mondays 05:23 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  security-events: write

concurrency:
  group: weekly-maintenance
  cancel-in-progress: false

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit + missed-updates report
        id: audit
        env:
          # Advisories accepted with documented mitigations (keep in sync with ci.yml):
          # - next GHSA-9g9p-9gw9-jx7f (Image Optimizer DoS) — images.unoptimized=true
          # - next GHSA-ggv3-7p47-pfv8 (rewrites smuggling)  — no rewrites configured
          ACCEPTED: 'GHSA-9g9p-9gw9-jx7f GHSA-ggv3-7p47-pfv8'
        run: |
          node scripts/maintenance/dep-audit.mjs

      - name: Open issue on audit failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            let report = {}
            try { report = JSON.parse(fs.readFileSync('dep-audit-report.json', 'utf8')) } catch {}
            const week = new Date().toISOString().slice(0, 10)
            const title = `🛡️ Weekly dependency audit failed — week of ${week}`
            const body = [
              '## Dependency audit report',
              '',
              '### Blocking advisories / breakage',
              ...(report.blocking || []).map(x => `- ❌ ${x}`),
              '',
              '<details><summary>Missed updates (advisory)</summary>',
              '',
              ...(report.outdated || []).map(x => `- ℹ️ ${x}`),
              ...(report.outdated?.length ? [] : ['- none — all runtime deps current']),
              '',
              '</details>',
              '',
              '_Auto-generated by the weekly deep maintenance workflow._',
            ].join('\n')

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            })
            const dup = existing.data.find(i => i.title.startsWith('🛡️ Weekly dependency audit failed') && !i.pull_request)
            if (dup) {
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: dup.number, title,
              })
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: dup.number, body,
              })
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['maintenance', 'dependencies'],
              })
            }

  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Guard — CodeQL needs a public repo (advanced security)
        id: guard
        run: |
          VIS=$(curl -s -H "Authorization: Bearer ${{ github.token }}" \
            "${GITHUB_API_URL}/repos/${{ github.repository }}" | node -e \
            'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{try{console.log(JSON.parse(d).visibility||"unknown")}catch{console.log("unknown")}})')
          echo "visibility=$VIS"
          if [ "$VIS" = "public" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; fi

      - if: steps.guard.outputs.run == 'true'
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended

      - if: steps.guard.outputs.run == 'true'
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"

  weekly-telemetry:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Weekly probes (crashes, stale push subs, 30d trend)
        id: probes
        env:
          SITE_URL: https://kivora.pages.dev
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          WEEKLY: '1'
        run: node scripts/maintenance/healthcheck.mjs

      - name: Detect findings (report exists even when probes pass)
        id: weekly-findings
        if: always()
        run: |
          if [ -f maintenance-report.json ]; then
            node -e 'const r=require("./maintenance-report.json");const n=(r.findings||[]).length+(r.failures||[]).length;console.log("has_findings="+(n>0))' >> "$GITHUB_OUTPUT"
          else
            echo "has_findings=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update weekly findings issue
        if: failure() || steps.weekly-findings.outputs.has_findings == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            let report = {}
            try { report = JSON.parse(fs.readFileSync('maintenance-report.json', 'utf8')) } catch {}
            const hasFindings = (report.findings?.length || 0) + (report.failures?.length || 0) > 0
            if (!hasFindings) {
              console.log('No findings this week — no issue needed.')
              return
            }
            const week = new Date().toISOString().slice(0, 10)
            const title = `🧭 Weekly maintenance findings — week of ${week}`
            const body = [
              '## Weekly maintenance report',
              '',
              `Site: ${report.site_url || 'https://kivora.pages.dev'} · Generated: ${report.generated_at || week}`,
              '',
              ...(report.failures || []).map(f => `- ❌ **${f.check}**: ${f.detail}`),
              ...(report.findings || []).map(f => `- ⚠️ **${f.check}**: ${f.message}`),
              '',
              ...(report.crashes?.length ? [
                '### Crash signatures (24h at probe time)',
                '',
                '| × | Signature |',
                '|---|---|',
                ...report.crashes.map(c => `| ${c.count} | \`${String(c.signature).replace(/`/g, "'").slice(0, 120)}\` |`),
              ] : []),
              '',
              '_Auto-generated by the weekly deep maintenance workflow._',
            ].join('\n')

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            })
            const dup = existing.data.find(i => i.title.startsWith('🧭 Weekly maintenance findings') && !i.pull_request)
            if (dup) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: dup.number, body,
              })
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['maintenance'],
              })
            }
