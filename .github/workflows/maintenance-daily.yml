name: Daily Maintenance

# Scheduled maintenance engine (v5.24):
#   1. production-health — zero-dependency probes against live prod:
#      site, /api/health, manifest, sw.js push handlers, VAPID key sanity,
#      OG image, plus a crash-telemetry digest from client_errors when
#      SUPABASE_URL / SUPABASE_SERVICE_KEY secrets are set. Any hard failure
#      (or crash spike) opens/updates a GitHub issue automatically.
#   2. build-drift — full `next build` on main with placeholder envs, so
#      code breaks introduced between deploys (merged deps, direct commits)
#      surface within 24h instead of at the next deploy.
#
# Secrets (all optional — steps degrade gracefully when absent):
#   SUPABASE_URL, SUPABASE_SERVICE_KEY — enables the crash/usage digest
#   VAPID_PUBLIC_KEY                   — strict-match check against /api/push/key

on:
  schedule:
    - cron: '37 4 * * *' # daily 04:37 UTC — after the credit reset, before EU/US morning
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: daily-maintenance
  cancel-in-progress: false

jobs:
  production-health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Probe production (site, PWA, push, OG + crash telemetry)
        env:
          SITE_URL: https://kivora.pages.dev
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/maintenance/healthcheck.mjs

      - name: Open or update issue on failure
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs')
            let report = {}
            try { report = JSON.parse(fs.readFileSync('maintenance-report.json', 'utf8')) } catch {}

            const date = new Date().toISOString().slice(0, 10)
            const title = `🔴 Daily maintenance failed — ${date}`
            const body = [
              '## Daily maintenance report',
              '',
              `Site: ${report.site_url || 'https://kivora.pages.dev'} · Generated: ${report.generated_at || date}`,
              '',
              '### Hard failures',
              ...(report.failures || []).map(f => `- ❌ **${f.check}**: ${f.detail}`),
              '',
              '<details><summary>Findings (advisory)</summary>',
              '',
              ...(report.findings || []).map(f => `- ⚠️ **${f.check}**: ${f.message}`),
              ...(report.findings?.length ? [] : ['- none']),
              '',
              '</details>',
              ...(report.crashes?.length ? [
                '',
                '### Crash signatures (24h)',
                '',
                '| × | Signature |',
                '|---|---|',
                ...report.crashes.map(c => `| ${c.count} | \`${String(c.signature).replace(/`/g, "'").slice(0, 120)}\` |`),
              ] : []),
              '',
              '_Auto-generated by the daily maintenance workflow._',
            ].join('\n')

            // Dedupe: search OPEN issues with this exact title (list API — no
            // search-index lag) and comment instead of opening a duplicate.
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            })
            const dup = existing.data.find(i => i.title === title && !i.pull_request)
            if (dup) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: dup.number,
                body,
              })
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['maintenance'],
              })
            }

  build-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (placeholder envs — catches code breaks between deploys)
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          NEXT_PUBLIC_SITE_URL: https://kivora.pages.dev
        run: npm run build
