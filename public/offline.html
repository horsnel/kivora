<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline — Kivora</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #0a0a0a;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }
  .card { max-width: 380px; }
  .mark {
    width: 56px; height: 56px; border-radius: 16px;
    background: linear-gradient(135deg, #e02020, #a81c1c);
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 20px;
    box-shadow: 0 8px 30px rgba(220, 38, 38, 0.25);
  }
  h1 { font-size: 20px; font-weight: 600; letter-spacing: -0.02em; margin-bottom: 8px; }
  p { font-size: 14px; color: #737373; line-height: 1.6; margin-bottom: 24px; }
  button {
    background: #dc2626; color: #fff; border: none; cursor: pointer;
    padding: 11px 28px; border-radius: 12px; font-size: 14px; font-weight: 600;
    transition: background .15s ease;
  }
  button:hover { background: #b91c1c; }
  .status { margin-top: 16px; font-size: 12px; color: #525252; }
</style>
</head>
<body>
<div class="card">
  <div class="mark">
    <svg width="26" height="26" viewBox="0 0 32 32" fill="none">
      <path d="M16 5L7 23.5L16 18.2Z" fill="#fff" opacity="0.95"/>
      <path d="M16 5L25 23.5L16 18.2Z" fill="#fff" opacity="0.55"/>
      <rect x="7.5" y="25.4" width="17" height="2.6" rx="1.3" fill="#fff" opacity="0.35"/>
    </svg>
  </div>
  <h1>You're offline</h1>
  <p>Kivora needs a connection to reach the AI. Check your network — your session will be right where you left it.</p>
  <button onclick="location.reload()">Try again</button>
  <div class="status" id="status">Waiting for connection…</div>
</div>
<script>
  // Auto-recover as soon as the network is back
  window.addEventListener('online', function () {
    document.getElementById('status').textContent = 'Connection restored — reloading…';
    setTimeout(function () { location.reload(); }, 600);
  });
</script>
</body>
</html>
